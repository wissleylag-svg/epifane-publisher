<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EPIFANE Publisher</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f4ef;
      margin: 0;
      padding: 30px;
      color: #222;
    }

    .container {
      max-width: 820px;
      margin: auto;
      background: white;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .small-note {
      font-size: 13px;
      color: #777;
      margin-top: 5px;
    }

    button {
      width: 100%;
      margin-top: 28px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #1f1f1f;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      display: none;
      white-space: pre-wrap;
    }

    .success {
      display: block !important;
      background: #e9f8ee;
      color: #176b35;
    }

    .error {
      display: block !important;
      background: #fdecec;
      color: #a52222;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>EPIFANE Publisher</h1>

    <div class="subtitle">
      Crear productos en Shopify como borrador
    </div>
<div class="sm5-import">
  <label for="sm5Input">Resultado completo de SM5</label>

  <textarea
    id="sm5Input"
    placeholder="Pega aquí la ficha completa generada por SM5"
    style="min-height:220px;"
  ></textarea>

  <button
    type="button"
    id="loadSm5Button"
    style="margin-bottom:25px;"
  >
    Cargar ficha desde SM5
  </button>
</div>
    <form id="productForm">

      <label for="title">Título del producto</label>
      <input
        id="title"
        type="text"
        required
        placeholder="Ej. De su mano, siempre seguro – Jesús guiando a una niña"
      />

      <label for="description">Descripción</label>
      <textarea
        id="description"
        placeholder="Descripción completa del producto"
      ></textarea>

      <label for="vendor">Proveedor</label>
      <input
        id="vendor"
        type="text"
        placeholder="Ej. Printify"
      />

      <label for="productType">Tipo de producto</label>
      <input
        id="productType"
        type="text"
        placeholder="Ej. Canvas"
      />

      <label for="collections">Colecciones</label>
      <input
        id="collections"
        type="text"
        placeholder="Ej. Colección Arte Devocional, AVADA - Best Sellers"
      />
      <div class="small-note">
        Separa varias colecciones con comas.
      </div>

      <label for="tags">Etiquetas</label>
      <input
        id="tags"
        type="text"
        placeholder="Ej. Art & Wall Decor, Canvas, Decor, Religious Art"
      />
      <div class="small-note">
        Separa varias etiquetas con comas.
      </div>

      <label for="seoTitle">Título SEO</label>
      <input
        id="seoTitle"
        type="text"
        maxlength="70"
        placeholder="Título para Google"
      />

      <label for="metaDescription">Metadescripción</label>
      <textarea
        id="metaDescription"
        maxlength="160"
        placeholder="Descripción para Google"
      ></textarea>

      <label for="handle">Identificador de URL / Handle</label>
      <input
        id="handle"
        type="text"
        placeholder="Ej. cuadro-de-su-mano-siempre-seguro"
      />

      <button id="submitButton" type="submit">
        Crear borrador en Shopify
      </button>
    </form>

    <div id="status"></div>
  </div>

  <script>
    const form = document.getElementById("productForm");
    const statusBox = document.getElementById("status");
    const submitButton = document.getElementById("submitButton");
const sm5Input = document.getElementById("sm5Input");
const loadSm5Button = document.getElementById("loadSm5Button");

function cleanSm5Value(value) {
  return value
    .replace(/^\s*[-•]\s*/gm, "")
    .replace(/`/g, "")
    .replace(/\*\*/g, "")
    .trim();
}

function getBlock(text, blockNumber) {
  const startMarker = new RegExp(
    `#\\s*BLOQUE\\s+${blockNumber}\\b`,
    "i"
  );

  const match = startMarker.exec(text);

  if (!match) return "";

  const start = match.index;
  const remaining = text.slice(start);

  const nextBlock = remaining
    .slice(match[0].length)
    .search(/\n#\s*BLOQUE\s+\d+\b/i);

  if (nextBlock === -1) {
    return remaining;
  }

  return remaining.slice(
    0,
    match[0].length + nextBlock
  );
}

function getField(block, label) {
  const escapedLabel = label.replace(
    /[.*+?^${}()|[\]\\]/g,
    "\\$&"
  );

  const regex = new RegExp(
    `\\*\\*${escapedLabel}\\*\\*\\s*\\n([\\s\\S]*?)(?=\\n\\s*\\*\\*[^\\n]+\\*\\*|\\n#\\s*BLOQUE|$)`,
    "i"
  );

  const match = block.match(regex);

  return match ? cleanSm5Value(match[1]) : "";
}

function getTags(block) {
  const tagsSection = getField(block, "Tags");

  if (!tagsSection) return "";

  return tagsSection
    .split("\n")
    .map(tag => cleanSm5Value(tag))
    .filter(Boolean)
    .join(", ");
}

loadSm5Button.addEventListener("click", () => {
  const text = sm5Input.value.trim();

  if (!text) {
    statusBox.className = "error";
    statusBox.textContent =
      "❌ Pega primero la ficha completa de SM5.";
    return;
  }

  const seoBlock = getBlock(text, 2);
  const shopifyBlock = getBlock(text, 4);
  const englishBlock = getBlock(text, 5);

  const title = getField(
    englishBlock,
    "Product Title"
  );

  const description = getField(
    englishBlock,
    "Full Description"
  );

  const vendor = getField(
    shopifyBlock,
    "Vendor"
  );

  const productType = getField(
    shopifyBlock,
    "Product Type"
  );

  const collection = getField(
    shopifyBlock,
    "Collection"
  );

  const tags = getTags(shopifyBlock);

  const seoTitle = getField(
    englishBlock,
    "SEO Title"
  );

  const metaDescription = getField(
    englishBlock,
    "Meta Description"
  );

  const handle = getField(
    seoBlock,
    "URL (Handle)"
  );

  document.getElementById("title").value = title;
  document.getElementById("description").value = description;
  document.getElementById("vendor").value = vendor;
  document.getElementById("productType").value = productType;
  document.getElementById("collections").value = collection;
  document.getElementById("tags").value = tags;
  document.getElementById("seoTitle").value = seoTitle;
  document.getElementById("metaDescription").value = metaDescription;
  document.getElementById("handle").value = handle;

  statusBox.className = "success";
  statusBox.textContent =
    "✅ Ficha SM5 cargada. Revisa los campos antes de enviarla a Shopify.";
});
    function splitCommaValues(value) {
      return value
        .split(",")
        .map(item => item.trim())
        .filter(Boolean);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const payload = {
        title: document.getElementById("title").value.trim(),
        description: document.getElementById("description").value.trim(),
        vendor: document.getElementById("vendor").value.trim(),
        productType: document.getElementById("productType").value.trim(),
        collections: splitCommaValues(
          document.getElementById("collections").value
        ),
        tags: splitCommaValues(
          document.getElementById("tags").value
        ),
        seoTitle: document.getElementById("seoTitle").value.trim(),
        metaDescription: document.getElementById("metaDescription").value.trim(),
        handle: document.getElementById("handle").value.trim()
      };

      statusBox.className = "";
      statusBox.style.display = "block";
      statusBox.textContent = "Creando producto...";
      submitButton.disabled = true;

      try {
        const response = await fetch("/api", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || "No se pudo crear el producto.");
        }

        statusBox.className = "success";
        statusBox.textContent =
          "✅ Producto creado correctamente como borrador en Shopify.\n\n" +
          "Título: " + data.product.title +
          "\nHandle: " + data.product.handle;

        form.reset();
      } catch (error) {
        statusBox.className = "error";
        statusBox.textContent = "❌ Error: " + error.message;
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
