<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EPIFANE Publisher</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f4ef;
      margin: 0;
      padding: 30px;
      color: #222;
    }

    .container {
      max-width: 820px;
      margin: auto;
      background: white;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .small-note {
      font-size: 13px;
      color: #777;
      margin-top: 5px;
    }

    button {
      width: 100%;
      margin-top: 28px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #1f1f1f;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      display: none;
      white-space: pre-wrap;
    }

    .success {
      display: block !important;
      background: #e9f8ee;
      color: #176b35;
    }

    .error {
      display: block !important;
      background: #fdecec;
      color: #a52222;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>EPIFANE Publisher</h1>

    <div class="subtitle">
      Crear productos en Shopify como borrador
    </div>

    <form id="productForm">

      <label for="title">Título del producto</label>
      <input
        id="title"
        type="text"
        required
        placeholder="Ej. De su mano, siempre seguro – Jesús guiando a una niña"
      />

      <label for="description">Descripción</label>
      <textarea
        id="description"
        placeholder="Descripción completa del producto"
      ></textarea>

      <label for="vendor">Proveedor</label>
      <input
        id="vendor"
        type="text"
        placeholder="Ej. Printify"
      />

      <label for="productType">Tipo de producto</label>
      <input
        id="productType"
        type="text"
        placeholder="Ej. Canvas"
      />

      <label for="collections">Colecciones</label>
      <input
        id="collections"
        type="text"
        placeholder="Ej. Colección Arte Devocional, AVADA - Best Sellers"
      />
      <div class="small-note">
        Separa varias colecciones con comas.
      </div>

      <label for="tags">Etiquetas</label>
      <input
        id="tags"
        type="text"
        placeholder="Ej. Art & Wall Decor, Canvas, Decor, Religious Art"
      />
      <div class="small-note">
        Separa varias etiquetas con comas.
      </div>

      <label for="seoTitle">Título SEO</label>
      <input
        id="seoTitle"
        type="text"
        maxlength="70"
        placeholder="Título para Google"
      />

      <label for="metaDescription">Metadescripción</label>
      <textarea
        id="metaDescription"
        maxlength="160"
        placeholder="Descripción para Google"
      ></textarea>

      <label for="handle">Identificador de URL / Handle</label>
      <input
        id="handle"
        type="text"
        placeholder="Ej. cuadro-de-su-mano-siempre-seguro"
      />

      <button id="submitButton" type="submit">
        Crear borrador en Shopify
      </button>
    </form>

    <div id="status"></div>
  </div>

  <script>
    const form = document.getElementById("productForm");
    const statusBox = document.getElementById("status");
    const submitButton = document.getElementById("submitButton");

    function splitCommaValues(value) {
      return value
        .split(",")
        .map(item => item.trim())
        .filter(Boolean);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const payload = {
        title: document.getElementById("title").value.trim(),
        description: document.getElementById("description").value.trim(),
        vendor: document.getElementById("vendor").value.trim(),
        productType: document.getElementById("productType").value.trim(),
        collections: splitCommaValues(
          document.getElementById("collections").value
        ),
        tags: splitCommaValues(
          document.getElementById("tags").value
        ),
        seoTitle: document.getElementById("seoTitle").value.trim(),
        metaDescription: document.getElementById("metaDescription").value.trim(),
        handle: document.getElementById("handle").value.trim()
      };

      statusBox.className = "";
      statusBox.style.display = "block";
      statusBox.textContent = "Creando producto...";
      submitButton.disabled = true;

      try {
        const response = await fetch("/api", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || "No se pudo crear el producto.");
        }

        statusBox.className = "success";
        statusBox.textContent =
          "✅ Producto creado correctamente como borrador en Shopify.\n\n" +
          "Título: " + data.product.title +
          "\nHandle: " + data.product.handle;

        form.reset();
      } catch (error) {
        statusBox.className = "error";
        statusBox.textContent = "❌ Error: " + error.message;
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
